services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prime_um_ascend
    ports:
      - "5432:5432"
    volumes:
      - prime_um_ascend_pgdata:/var/lib/postgresql/data

volumes:
  prime_um_ascend_pgdata:
