 <section class="card"><div class="card-h"><h2>เป้าหมายสรรหา (สำหรับคำนวณ Readiness)</h2></div><div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${Object.entries(st.recruitTargets).map(([k,v])=>fInput(STAGES.find(s=>s.k===k).l,'r_'+k,v,{type:'number',min:1,req:true})).join('')}${fInput('Coaching/1-on-1 ที่ให้ทีม (90 วัน)','coachingTarget',st.coachingTarget,{type:'number',min:1,req:true})}</div></section>
 <section class="card"><div class="card-h"><h2>น้ำหนัก Internal UM Readiness</h2><span class="meta" id="wsum">รวม ${tw}%</span></div><div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${DIMS.map(d=>fInput(d.l+' (%)','w_'+d.k,st.weights[d.k],{type:'number',min:0,max:100,req:true})).join('')}${fInput('เกณฑ์ Ready (คะแนน)','readyThreshold',st.readyThreshold,{type:'number',min:1,max:100,req:true})}</div>${disclaimer('คะแนนนี้เป็นตัวชี้วัดการพัฒนาภายใน การใช้เป็นเกณฑ์ทางการต้องได้รับอนุมัติจากผู้บริหารที่มีอำนาจ')}</section>
 <section class="card"><div class="card-h"><h2>เกณฑ์ Final Assessment</h2></div><div class="form-grid">${st.finalCriteria.map((c,i)=>fInput('เกณฑ์ '+(i+1),'fcn_'+i,c.name,{req:true})+fInput('คะแนนเต็ม','fcm_'+i,c.max,{type:'number',min:1,req:true})).join('')}${fInput('เกณฑ์ผ่านภายใน (%)','finalPass',st.finalPass,{type:'number',min:1,max:100,req:true})}</div></section>
 <div class="row"><button class="btn primary lg" type="submit">${icon('check')}บันทึกการตั้งค่า</button><button class="btn" type="button" data-act="resetSettings">คืนค่าเริ่มต้น</button></div></form>`}
document.addEventListener('input',e=>{const f=e.target.closest('#kpiSettings');if(!f||!e.target.name?.startsWith('w_'))return;const t=sum(DIMS.map(d=>+f['w_'+d.k].value||0));const el=$('#wsum');if(el){el.textContent='รวม '+t+'%';el.style.color=t===100?'':'var(--red)'}});
document.addEventListener('submit',e=>{if(e.target.id!=='kpiSettings')return;e.preventDefault();const f=e.target;const num=n=>Number(f[n].value);
 const bad=[...f.elements].find(el=>el.type==='number'&&(el.value===''||!isFinite(+el.value)||+el.value<(+el.min||0)||(el.max&&+el.value>+el.max)));if(bad){toast('ตรวจสอบค่า "'+(bad.closest('.field')?.querySelector('label')?.textContent||bad.name)+'" ให้อยู่ในช่วงที่ถูกต้อง','err');bad.focus();return}
 const tw=sum(DIMS.map(d=>num('w_'+d.k)));if(tw!==100){toast('น้ำหนัก Readiness ต้องรวมกันเท่ากับ 100% (ตอนนี้ '+tw+'%)','err');f['w_'+DIMS[0].k].focus();return}
 const old=JSON.stringify(S.settings.weights);
 if(commit(()=>{const st=S.settings;KPI_METRICS.forEach(M=>st.kpiTargets[M.k]=num('t_'+M.k));Object.keys(st.recruitTargets).forEach(k=>st.recruitTargets[k]=num('r_'+k));st.coachingTarget=num('coachingTarget');DIMS.forEach(d=>st.weights[d.k]=num('w_'+d.k));st.readyThreshold=num('readyThreshold');st.finalCriteria.forEach((c,i)=>{c.name=f['fcn_'+i].value.trim()||c.name;c.max=num('fcm_'+i)});st.finalPass=num('finalPass');audit(old!==JSON.stringify(st.weights)?'score.weights_changed':'settings.updated','settings','kpi',{weights:st.weights})},'บันทึกการตั้งค่าแล้ว'))render()});
ACT.resetSettings=()=>confirmDialog('คืนค่าเริ่มต้น','ตั้งค่า KPI น้ำหนัก และเกณฑ์ทั้งหมดจะกลับเป็นค่าเริ่มต้น','คืนค่าเริ่มต้น',()=>commit(()=>{S.settings=defaultSettings();audit('settings.reset','settings','kpi')},'คืนค่าเริ่มต้นแล้ว'));
function pageCompetencies(){return pageHead('Competencies','ทักษะที่ใช้ประเมินใน Competency Matrix',`<button class="btn primary" data-act="editComp">${icon('plus')}เพิ่ม Competency</button>`)+`<div class="comp-grid">${COMP_CATS.map(c=>`<section class="card"><div class="card-h"><h2>${c.l}</h2></div><div class="list">${S.competencies.filter(x=>x.cat===c.k).map(x=>`<div class="li"><div class="li-main"><div class="li-t">${esc(x.name)}</div>${x.desc?`<div class="li-s">${esc(x.desc)}</div>`:''}</div><button class="icon-btn" data-act="editComp" data-id="${x.id}" aria-label="แก้ไข ${esc(x.name)}">${icon('edit')}</button><button class="icon-btn" data-act="delComp" data-id="${x.id}" aria-label="ลบ ${esc(x.name)}">${icon('trash')}</button></div>`).join('')}</div></section>`).join('')}</div>`}
ACT.editComp=el=>{const c=el.dataset.id?S.competencies.find(x=>x.id===el.dataset.id):null;openModal({title:c?'แก้ไข Competency':'เพิ่ม Competency',body:`<div class="form-grid">${fInput('ชื่อ','name',c?.name||'',{req:true,full:true})}${fSelect('หมวด','cat',COMP_CATS.map(x=>[x.k,x.l]),c?.cat||'leadership',{full:true})}${fText('คำอธิบาย','desc',c?.desc||'',{rows:2})}</div>`,submit:'บันทึก',onSubmit:f=>commit(()=>{const r=c||{id:genId('c')};Object.assign(r,{name:f.name.value.trim(),cat:f.cat.value,desc:f.desc.value.trim()});if(!c)S.competencies.push(r);audit('competency.saved','competency',r.id)},'บันทึกแล้ว')})};
ACT.delComp=el=>{const c=S.competencies.find(x=>x.id===el.dataset.id);confirmDialog('ลบ Competency','ลบ "'+c.name+'" ผลประเมินเดิมของทักษะนี้จะไม่ถูกนับใน Readiness','ลบ',()=>commit(()=>{S.competencies=S.competencies.filter(x=>x.id!==c.id);S.actions.forEach(a=>{if(a.competencyId===c.id)a.competencyId=null});audit('competency.deleted','competency',c.id)},'ลบแล้ว'))};
function storageSize(){try{return new Blob([JSON.stringify(S)]).size}catch(e){return 0}}
function pageSettings(){const size=storageSize();UI.auditN=UI.auditN||30;
 return pageHead('Settings','ข้อมูลระบบ การสำรองข้อมูล และ Audit trail')+`<div class="grid g2"><section class="card"><div class="card-h"><h2>ข้อมูล (Demo mode)</h2></div><p class="small">ข้อมูลทั้งหมดเก็บใน localStorage ของเบราว์เซอร์นี้ ขนาดปัจจุบัน <b class="num">${(size/1024).toFixed(0)} KB</b> (เบราว์เซอร์ส่วนใหญ่รองรับประมาณ 5 MB)</p><div class="mt12">${bar(size/5e6*100)}</div>${STORAGE_OK?'':'<div class="note warn mt12">เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกถาวร ข้อมูลจะหายเมื่อปิดหน้า</div>'}<div class="row wrap mt16"><button class="btn" data-act="exportJson">${icon('download')}สำรองข้อมูล (JSON)</button><label class="btn">${icon('upload')}นำเข้าข้อมูลสำรอง<input type="file" accept="application/json,.json" data-chg="importJson" class="sr-only"></label><button class="btn danger" data-act="resetDemo">${icon('refresh')}รีเซ็ตข้อมูลสาธิต</button></div></section>
 <section class="card"><div class="card-h"><h2>สำหรับใช้งานจริง</h2></div><p class="small">เวอร์ชันนี้เป็น MVP แบบไฟล์เดียวสำหรับสาธิตและทดสอบ flow การใช้งานจริงตาม spec ต้องมีระบบยืนยันตัวตน ฐานข้อมูล (PostgreSQL) การตรวจสิทธิ์ฝั่งเซิร์ฟเวอร์ และที่เก็บไฟล์ที่ปลอดภัย โครงสร้างข้อมูลในแอปนี้ตรงกับ Database Model ของ spec เพื่อย้ายได้ง่าย</p></section></div>
 <section class="card mt24"><div class="card-h"><h2>Audit trail</h2><span class="meta">${S.audit.length} รายการล่าสุด</span></div><div class="table-wrap"><table class="t"><thead><tr><th>เวลา</th><th>ผู้ทำ</th><th>Action</th><th>Entity</th><th>รายละเอียด</th></tr></thead><tbody>${S.audit.slice(0,UI.auditN).map(a=>`<tr><td class="small num">${fmtDT(a.at)}</td><td class="small">${esc(a.actorId==='system'?'ระบบ':nameOf(a.actorId))}</td><td><span class="tag">${esc(a.action)}</span></td><td class="small">${esc(a.entity)} · ${esc(String(a.entityId).slice(0,20))}</td><td class="xs muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(a.meta||{}))}</td></tr>`).join('')}</tbody></table></div>${S.audit.length>UI.auditN?`<button class="btn sm mt12" data-act="moreAudit">แสดงเพิ่ม</button>`:''}</section>`}
ACT.moreAudit=()=>{UI.auditN+=50;render()};
ACT.exportJson=()=>downloadFile('prime-um-ascend-backup_'+iso(today())+'.json',JSON.stringify(S,null,1));
CHG.importJson=el=>{const f=el.files[0];el.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('ไฟล์ไม่ใช่ JSON ที่ถูกต้อง','err');return}if(!d||d.version!==DATA_VERSION||!Array.isArray(d.users)||!d.users.some(u=>u.id===me().id&&u.role==='admin')){toast('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของ PRIME UM ASCEND เวอร์ชันนี้ หรือไม่มีบัญชี Admin ของคุณ','err');return}confirmDialog('นำเข้าข้อมูลสำรอง','ข้อมูลปัจจุบันทั้งหมดจะถูกแทนที่ด้วยไฟล์นี้','นำเข้าข้อมูล',()=>{const prev=S;S=d;if(!persist()){S=prev;toast('นำเข้าไม่สำเร็จ: พื้นที่เก็บข้อมูลไม่พอ','err');return false}commit(()=>audit('data.imported','system','-'));toast('นำเข้าข้อมูลแล้ว');return true})};r.readAsText(f)};
ACT.resetDemo=()=>confirmDialog('รีเซ็ตข้อมูลสาธิต','ข้อมูลทั้งหมดในเบราว์เซอร์นี้จะถูกลบและสร้างข้อมูลสาธิตใหม่ คุณจะถูกออกจากระบบ','รีเซ็ตข้อมูล',()=>{S=seed();persist();SESSION=null;saveSession();try{Object.keys(sessionStorage).filter(k=>k.startsWith('draft:')).forEach(k=>sessionStorage.removeItem(k))}catch(e){}location.hash='/login';toast('รีเซ็ตข้อมูลแล้ว');return true});

route(/^\/journey$/,pageJourney,ALL);
route(/^\/journey\/([\w-]+)$/,pagePhase,ALL);

route(/^\/actions\/([\w-]+)$/,pageActionDetail,ALL);
route(/^\/performance$/,pagePerformance,ALL);
route(/^\/recruitment$/,pageRecruitment,ALL);
route(/^\/development$/,pageDevelopment,ALL);
route(/^\/leadership$/,pageLeadership,ALL);
route(/^\/evidence$/,pageEvidence,ALL);
route(/^\/weekly-review$/,pageWeekly,ALL);
route(/^\/monthly-review$/,pageMonthly,ALL);

window.addEventListener('hashchange',()=>{closeOverlay();render()});
let lastCompact=window.innerWidth<640;
window.addEventListener('resize',()=>{const c=window.innerWidth<640;if(c!==lastCompact){lastCompact=c;if(me()&&!$('.overlay'))render()}});
window.addEventListener('storage',e=>{if(e.key===DATA_KEY&&e.newValue){try{S=JSON.parse(e.newValue);if(!$('.overlay'))render()}catch(x){}}});
(function boot(){try{const t=store.get('prime-um-ascend:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
 loadData();loadSession();if(me())generateDailyNotifications();render()})();
